[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claimpilot"
version = "0.1.0"
description = "ClaimPilot MVP event-driven core"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.1",
  "google-api-python-client>=2.140.0",
  "google-auth>=2.34.0",
  "google-auth-oauthlib>=1.2.1",
  "strands-agents>=0.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
claimpilot-demo = "claimpilot.desktop_ui:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
